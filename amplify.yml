version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
        - npm install -g @aws-amplify/cli
    build:
      commands:
        - npm run build
        - npm run start &
  artifacts:
    baseDirectory: frontend
    files:
      - '.next/**/*'
      - 'node_modules/**/*'
      - 'public/**/*'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
  cache:
    paths:
      - frontend/node_modules/**/*