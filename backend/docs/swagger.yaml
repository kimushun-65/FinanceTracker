basePath: /api/v1
definitions:
  financetracker_internal_application_dto.AccountListResponse:
    properties:
      accounts:
        items:
          $ref: '#/definitions/financetracker_internal_application_dto.AccountResponse'
        type: array
      total_balance:
        type: number
      total_count:
        type: integer
    type: object
  financetracker_internal_application_dto.AccountResponse:
    properties:
      account_type:
        type: string
      balance:
        type: number
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  financetracker_internal_application_dto.BudgetListResponse:
    properties:
