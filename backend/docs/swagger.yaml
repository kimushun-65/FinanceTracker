        type: array
      total_count:
        type: integer
    type: object
  financetracker_internal_application_dto.CategoryMasterResponse:
    properties:
      category_type:
        type: string
      color:
        type: string
      created_at:
        type: string
      display_order:
        type: integer
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  financetracker_internal_application_dto.CategoryResponse:
    properties:
      category_master_id:
        type: string
      created_at:
        type: string
      custom_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  financetracker_internal_application_dto.CreateAccountRequest:
    properties:
      account_type:
        enum:
        - checking
        - investment
        - cash
        type: string
      currency:
        type: string
      initial_balance:
        minimum: 0
        type: number
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - account_type
    - currency
    - name
    type: object
  financetracker_internal_application_dto.CreateBudgetRequest:
    properties:
      amount:
        type: number
      category_id:
        type: string
      end_date:
        type: string
      period:
        enum:
        - monthly
        - yearly
        type: string
      start_date:
        type: string
    required:
    - amount
    - category_id
    - period
    - start_date
    type: object
  financetracker_internal_application_dto.CreateCategoryRequest:
    properties:
      category_master_id:
        type: string
      custom_name:
        maxLength: 50
        minLength: 1
        type: string
    required:
