        type: array
      total_count:
        type: integer
    type: object
  financetracker_internal_application_dto.BudgetResponse:
    properties:
      amount:
        type: number
      category_id:
        type: string
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      period:
        type: string
      start_date:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  financetracker_internal_application_dto.CategoryListResponse:
    properties:
